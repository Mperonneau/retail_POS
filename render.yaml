# Render Blueprint — Flutter web (static site)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: retail-pos
    runtime: static
    branch: main
    buildCommand: >-
      git clone https://github.com/flutter/flutter.git --depth 1 -b stable &&
      export PATH="$PWD/flutter/bin:$PATH" &&
      flutter config --enable-web &&
      flutter pub get &&
      flutter build web --release --dart-define=BUILD_ID=$RENDER_GIT_COMMIT &&
      python3 -c "import json,os; p='build/web/version.json'; d=json.load(open(p)); d['build_id']=os.environ.get('RENDER_GIT_COMMIT',''); json.dump(d, open(p,'w'))"
    staticPublishPath: build/web
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /version.json
        name: Cache-Control
        value: no-cache
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-cache
      - path: /flutter_bootstrap.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
