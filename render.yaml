# Render Blueprint — Flutter web (static site)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: retail-pos
    runtime: static
    branch: main
    buildCommand: >-
      git clone https://github.com/flutter/flutter.git --depth 1 -b stable &&
      export PATH="$PWD/flutter/bin:$PATH" &&
      flutter config --enable-web &&
      flutter pub get &&
      flutter build web --release --dart-define=BUILD_ID=$RENDER_GIT_COMMIT --dart-define=PAYMENTS_API=https://retail-pos-payments.onrender.com --dart-define=STOREFRONT_URL=https://retail-pos-storefront.onrender.com &&
      python3 -c "import json,os; p='build/web/version.json'; d=json.load(open(p)); d['build_id']=os.environ.get('RENDER_GIT_COMMIT',''); json.dump(d, open(p,'w'))"
    staticPublishPath: build/web
    buildFilter:
      ignoredPaths:
        - payments_server/**
        - storefront/**
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /version.json
        name: Cache-Control
        value: no-cache
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-cache
      - path: /flutter_bootstrap.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
  - type: web
    name: retail-pos-storefront
    runtime: static
    branch: main
    buildCommand: >-
      git clone https://github.com/flutter/flutter.git --depth 1 -b stable &&
      export PATH="$PWD/flutter/bin:$PATH" &&
      flutter config --enable-web &&
      cd storefront &&
      flutter pub get &&
      flutter build web --release --dart-define=BUILD_ID=$RENDER_GIT_COMMIT --dart-define=STOREFRONT_API=https://retail-pos-payments.onrender.com &&
      python3 -c "import json,os; p='build/web/version.json'; d=json.load(open(p)); d['build_id']=os.environ.get('RENDER_GIT_COMMIT',''); json.dump(d, open(p,'w'))"
    staticPublishPath: storefront/build/web
    buildFilter:
      paths:
        - storefront/**
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /version.json
        name: Cache-Control
        value: no-cache
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-cache
      - path: /flutter_bootstrap.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
  # Link previews. Facebook and Instagram read the shop page's HTML, and the
  # static site above is the same file for every path. This service builds the
  # same app and fills in the shop name, text and photo for each address.
  # Shop links on the static site redirect here so an already-shared URL
  # reaches this page. The canonical link is this service's public URL.
  - type: web
    name: retail-pos-vitrine
    runtime: python
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    buildCommand: >-
      pip install -r storefront/requirements.txt &&
      git clone https://github.com/flutter/flutter.git --depth 1 -b stable &&
      export PATH="$PWD/flutter/bin:$PATH" &&
      flutter config --enable-web &&
      cd storefront &&
      flutter pub get &&
      flutter build web --release --dart-define=BUILD_ID=$RENDER_GIT_COMMIT --dart-define=STOREFRONT_API=https://retail-pos-payments.onrender.com
    startCommand: python3 storefront/serve.py
    buildFilter:
      paths:
        - storefront/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: STOREFRONT_API
        value: https://retail-pos-payments.onrender.com
      - key: WEB_ROOT
        value: storefront/build/web
  # Secrets are set in the Render dashboard (sync: false). Never commit them.
  # Storefront data lives in STOREFRONT_DATA_DIR; attach a Render disk there so
  # requests survive restarts (the POS republishes the catalogue on its own).
  - type: web
    name: retail-pos-payments
    runtime: python
    branch: main
    buildCommand: "python3 -m compileall payments_server"
    startCommand: python3 payments_server/server.py
    # A restart forgets running catalogue analyses and vitrine data.
    buildFilter:
      paths:
        - payments_server/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: MONCASH_CLIENT_ID
        sync: false
      - key: MONCASH_SECRET
        sync: false
      - key: MONCASH_BASE_URL
        value: https://moncashbutton.digicelgroup.com
      - key: DAY_USD_RATE
        value: "135"
      - key: CLAUDE_API_SECRET_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
